// android/app/build.gradle
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "dev.flutterforge.eulerx_mathpro"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "dev.flutterforge.eulerx_mathpro"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}